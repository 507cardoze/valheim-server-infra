name: Terraform provision

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Run a plan only or apply the planned infrastructure"
        required: true
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read

concurrency:
  group: valheim-infrastructure
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: terraform

jobs:
  provision:
    name: Terraform ${{ inputs.action }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: provisioning

    env:
      CLOUDING_TOKEN: ${{ secrets.CLOUDING_TOKEN }}
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
      TF_VAR_image_id: ${{ secrets.CLOUDING_IMAGE_ID }}
      TF_VAR_flavor_id: ${{ secrets.CLOUDING_FLAVOR_ID }}
      TF_VAR_ssh_key_id: ${{ secrets.CLOUDING_SSH_KEY_ID }}
      TF_VAR_admin_cidr: ${{ secrets.VALHEIM_ADMIN_CIDR }}
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_WORKSPACE: valheim-server-infra

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Guard apply branch
        if: inputs.action == 'apply' && github.ref != 'refs/heads/main'
        run: |
          echo "Apply is allowed only from the main branch."
          exit 1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Check provisioning configuration
        run: |
          missing=()
          for name in CLOUDING_TOKEN TF_API_TOKEN TF_CLOUD_ORGANIZATION TF_VAR_image_id TF_VAR_flavor_id TF_VAR_ssh_key_id TF_VAR_admin_cidr; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing GitHub Environment configuration: ${missing[*]}"
            exit 1
          fi

      - name: Terraform init with remote state
        run: >-
          terraform init -input=false
          -lockfile=readonly
          -backend-config="organization=${TF_CLOUD_ORGANIZATION}"
          -backend-config="workspaces.name=${TF_WORKSPACE}"

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        run: terraform plan -input=false -out=valheim.tfplan -no-color

      - name: Terraform apply
        if: inputs.action == 'apply'
        run: terraform apply -input=false -auto-approve valheim.tfplan
